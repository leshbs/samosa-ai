<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SAMOSA">
  <!--
    A samosa: a filled triangle with a folded seam. It has to read at 16px in a
    tab strip, so it is one shape and one seam, with no text and no gradient.
    The fill is --primary (24 94% 50%), written as hex because a favicon is
    rendered outside the document and cannot see CSS custom properties.
  -->
  <rect width="32" height="32" rx="7" fill="#f97316" />
  <path d="M16 7.5 26 24.5H6Z" fill="#ffffff" />
  <path d="M16 7.5V24.5" stroke="#f97316" stroke-width="1.6" stroke-linecap="round" />
</svg>
